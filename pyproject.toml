[project]
name = "insightforge"
version = "1.0.0"
description = "InsightForge: Multi-agent AI dashboard generator with reproducible data analysis pipelines and automated BI visualization (LangGraph, FastAPI, Ollama, SQLite/MySQL/MS SQL, React)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy>=2.0.30",
    "sqlglot>=25.0.0",
    "pymysql>=1.1.1",
    "pymssql>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

